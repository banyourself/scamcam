name: Phishing.Database sync

on:
  schedule:
    - cron: "37 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phishing-database-sync
  cancel-in-progress: false

jobs:
  sync:
    if: vars.PHISHING_DATABASE_SYNC == 'enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download the active domain list at its latest commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api repos/Phishing-Database/Phishing.Database/commits/master --jq .sha)
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unexpected commit id from GitHub" >&2
            exit 1
          fi
          echo "LIST_VERSION=${sha:0:12}" >> "$GITHUB_ENV"
          curl --fail --silent --show-error --location --max-filesize 100000000 \
            "https://raw.githubusercontent.com/Phishing-Database/Phishing.Database/${sha}/phishing-domains-ACTIVE.txt" \
            --output list.txt
      - name: Build the hashed shards
        run: node scripts/domain-list.ts --input list.txt --out list.sql --version "$LIST_VERSION"
      - name: Write the shards to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute scamcam --remote --env production --file list.sql --yes
