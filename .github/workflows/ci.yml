name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  SCAMCAM_LOCAL_ONLY: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generated Worker types are current
        run: npm run cf-typegen && git diff --exit-code worker-configuration.d.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Backup and restore drill on a throwaway local database
        run: npm run test:recovery
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Registry signatures and provenance of installed packages
        run: npm audit signatures
      - name: Software bill of materials (CycloneDX)
        run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 30

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Use Cloudflare's public Turnstile test keys
        run: cp .dev.vars.example .dev.vars
      - name: axe-core WCAG 2.2 AA audit of every page and a real scan in both themes
        run: npm run test:a11y
        env:
          CHROME_PATH: /usr/bin/google-chrome

  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Use Cloudflare's public Turnstile test keys
        run: cp .dev.vars.example .dev.vars
      - name: Browser requests, cookies, storage, security headers, and a secret scan of the build
        run: npm run test:privacy
        env:
          CHROME_PATH: /usr/bin/google-chrome

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
