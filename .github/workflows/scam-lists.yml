name: Scam list sync

on:
  schedule:
    - cron: "37 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scam-list-sync
  cancel-in-progress: false

jobs:
  sync:
    if: vars.PHISHING_DATABASE_SYNC == 'enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Download each list at its latest commit, build the hashed shards, and write them to D1
        env:
          WRITE_TO_D1: "1"
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/sync-lists.sh
      - name: Build the site security and breach notice data and write it to D1
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          status=0
          node scripts/site-data.ts --out site-data || status=$?
          if [[ -s site-data/site-data.sql ]]; then
            npx wrangler d1 execute scamcam --remote --env production --file site-data/site-data.sql --yes > site-data/d1.log || status=1
          fi
          exit "$status"
